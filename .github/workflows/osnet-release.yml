name: OyunServerim release

# Pushing the osnet-release branch builds and publishes one release (CS2MenuManager-v<version>.zip).
# Same archive layout as upstream (shared/CS2MenuManager/, plugins/CS2MenuManager_MenuManager/).
# The assembly version stays 1.0.43 so plugins built against upstream keep binding.
on:
  push:
    branches: ["osnet-release"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ASM_VERSION: "1.0.43"
      OSNET_VERSION: "1.0.43-osnet.3"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: |
          dotnet build CS2MenuManager_MenuManager/CS2MenuManager_MenuManager.csproj -c Release \
            -p:Version=$ASM_VERSION -p:InformationalVersion=$OSNET_VERSION -p:GeneratePackageOnBuild=false
      - name: Package
        run: |
          test -f BuildOutput/shared/CS2MenuManager/CS2MenuManager.dll
          test -f BuildOutput/plugins/CS2MenuManager_MenuManager/CS2MenuManager_MenuManager.dll
          cd BuildOutput
          zip -r ../CS2MenuManager-v$OSNET_VERSION.zip * --exclude '*.nupkg' '*.xml'
          cd ..
          unzip -l CS2MenuManager-v$OSNET_VERSION.zip
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$OSNET_VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; bump OSNET_VERSION."
            exit 1
          fi
          gh release create "$TAG" "CS2MenuManager-v$OSNET_VERSION.zip" --target "$GITHUB_SHA" \
            --title "$TAG" --notes "OyunServerim.NET fork of schwarper/CS2MenuManager 1.0.43: menu lifecycle fix (tick/timer always cleaned, no stale menu for reconnecting players, no stacking), css_mm_debug diagnostics."
